# =====================================================
#  deploy/nginx.conf
#  Дадлага.мн — Nginx урд прокси + TLS
#
#  Байрлуулах:
#    sudo cp nginx.conf /etc/nginx/sites-available/dadlaga
#    sudo ln -s /etc/nginx/sites-available/dadlaga /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
#
#  dadlaga.mn -г өөрийн домэйнээр солино уу.
# =====================================================

# -----------------------------------------------------
#  HTTP → HTTPS
#  Certbot-ын шалгалтыг л HTTP-ээр өнгөрүүлнэ
# -----------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name dadlaga.mn www.dadlaga.mn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}


# -----------------------------------------------------
#  HTTPS
# -----------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dadlaga.mn www.dadlaga.mn;

    # --- Гэрчилгээ (certbot үүсгэнэ) ---
    ssl_certificate     /etc/letsencrypt/live/dadlaga.mn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dadlaga.mn/privkey.pem;

    # --- TLS тохиргоо ---
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # --- Хэмжээ, хугацаа ---
    client_max_body_size 3m;      # лого 2 МБ + нөөц зай
    client_body_timeout 20s;
    send_timeout 20s;

    # --- Шахалт ---
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Nginx-ийн хувилбарыг нуух
    server_tokens off;

    # --- Node сервер рүү дамжуулах ---
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Node тал жинхэнэ IP болон протоколыг мэдэхийн тулд.
        # Үүнтэй хамт .env дотор TRUST_PROXY=true байх ёстой.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
    }

    # --- Байршуулсан лого: удаан кэшлэх, гүйцэтгэхийг хориглох ---
    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Disposition inline always;
        expires 7d;
    }

    # --- Нуугдмал файлд хандахыг хаах ---
    location ~ /\. {
        deny all;
    }
}